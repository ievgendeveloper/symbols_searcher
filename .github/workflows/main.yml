name: build

on:
  push:
    branches: [develop, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache CMake FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: |
            build/${{ matrix.preset }}/_deps
          key: deps-${{ runner.os }}-${{ matrix.preset }}-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'CMakePresets.json') }}
          restore-keys: |
            deps-${{ runner.os }}-${{ matrix.preset }}-

      - name: Build and test (${{ matrix.preset }})
        shell: powershell
        run: .\build.ps1 -Preset ${{ matrix.preset }}

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.preset }}
          path: |
            build/${{ matrix.preset }}/Testing/**/*.log
            build/${{ matrix.preset }}/Testing/**/LastTest.log
          if-no-files-found: ignore
          retention-days: 14